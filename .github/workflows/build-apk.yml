name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source project
        run: |
          cat SnakeNova-source.part.* | base64 --decode > SnakeNova-source.zip
          unzip -q SnakeNova-source.zip
          mv SnakeNova-cloud SnakeNova
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Assemble debug APK
        working-directory: SnakeNova
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SnakeNova-debug-apk
          path: SnakeNova/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
